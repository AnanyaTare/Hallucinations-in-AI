version: "3.9"

services:
  api:
    build:
      context: ../..
      dockerfile: deployment/docker/Dockerfile
    container_name: hallucinations_api
    ports:
      - "8000:8000"
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - DATABASE_URL=sqlite:///./hallucinations.db
      - CHROMA_PERSIST_DIR=data/processed/chroma_db
      - DEBUG=false
    volumes:
      - ../../data:/app/data          # persist datasets & vector DB
      - ../../hallucinations.db:/app/hallucinations.db
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  streamlit:
    build:
      context: ../..
      dockerfile: deployment/docker/Dockerfile
    container_name: hallucinations_demo
    command: streamlit run deployment/app/streamlit_app.py --server.port 8501 --server.address 0.0.0.0
    ports:
      - "8501:8501"
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - API_BASE_URL=http://api:8000
    depends_on:
      - api
    restart: unless-stopped
